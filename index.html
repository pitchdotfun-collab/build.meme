    <style>
        :root {
            --color-background: #111111;
            --color-text: #E0E0E0;
            --color-primary: #00FF00; /* four.meme green */
            --color-border: #333333;
            --font-mono: 'Courier New', Courier, monospace;
        }
        
        body {
            font-family: var(--font-mono);
            background-color: var(--color-background);
            color: var(--color-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            color: var(--color-primary);
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--color-primary);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 40px;
        }

        .input-box {
            background-color: #1A1A1A;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 20px;
        }

        .token-input {
            width: 100%;
            background-color: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 15px;
            font-family: var(--font-mono);
            color: var(--color-text);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .token-input::placeholder {
            color: #555;
        }

        .btn-proceed {
            width: 100%;
            background-color: var(--color-primary);
            color: var(--color-background);
            border: none;
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-proceed:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .btn-proceed:hover:not(:disabled) {
            background-color: #fff;
            color: #000;
            box-shadow: 0 0 15px var(--color-primary);
        }

        .footer-warning {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #FFA500; /* Orange for warning */
            border: 1px solid #FFA500;
            padding: 10px;
            border-radius: 4px;
        }

        .footer-warning a {
            color: var(--color-primary);
            text-decoration: underline;
        }
        
        /* This is our results/status box */
        .results {
            display: none; /* Starts hidden */
            margin-top: 20px;
            padding: 15px;
            background-color: #1A1A1A;
            border: 1px solid var(--color-primary);
            border-radius: 8px;
            word-wrap: break-word;
        }
        .results p { margin: 0; }
    </style>
</head>

        // --- END OF CONFIGURATION ---


        // --- ENGINE LOGIC (MY JOB, DEVELOPER) ---

        // References to our HTML elements
        const deployButton = document.getElementById("btn-proceed");
        const tokenInput = document.getElementById("token-input");
        const resultsBox = document.getElementById("results-box");
        const resultsText = document.getElementById("results-text");

        let provider;
        let signer;

        // What happens when the "BUILD IT!" button is clicked
        deployButton.addEventListener("click", async () => {
            
            deployButton.disabled = true; // Disable button to prevent double clicks
            
            try {
                // 1. Connect to Wallet (MetaMask)
                if (typeof window.ethereum === "undefined") {
                    throw new Error("MetaMask is not installed. Please install it.");
                }
                
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []); // Request connection
                signer = provider.getSigner();
                
                // 2. Check for correct Network (BNB Testnet for now)
                const { chainId } = await provider.getNetwork();
                if (chainId.toString(16) !== TESTNET_CHAIN_ID.substring(2)) {
                    // Uncomment the line below to ask user to switch to Mainnet
                    // await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: MAINNET_CHAIN_ID }], });
                    
                    // For now, we only work on Testnet
                    throw new Error("Please switch your MetaMask to BNB Testnet (ChainID 97).");
                }

                // 3. Validate the Token Address
                const memecoinAddress = tokenInput.value;
                if (!ethers.utils.isAddress(memecoinAddress)) {
                    throw new Error("Invalid token address.");
                }
                
                // 4. Charge the Platform Fee (Our first transaction)
                showMessage("Processing platform fee (0.05 Testnet BNB)...");
                
                if (FEE_WALLET === "0x...[PASTE_YOUR_TREASURY_WALLET_ADDRESS_HERE]") {
                    throw new Error("CEO Error: FEE_WALLET is not configured in index.html!");
                }
                
                const feeTx = await signer.sendTransaction({
                    to: FEE_WALLET,
                    value: FEE_AMOUNT_WEI
                });
                await feeTx.wait(); // Wait for the fee transaction to be confirmed
                
                // 5. Deploy the Staking Contract (Our second transaction)
                showMessage("Fee paid! Deploying your new Staking Contract...");
                
                if (STAKING_CONTRACT_BYTECODE === "0x...[PASTE_YOUR_BYTECODE_TEXT_HERE]") {
                    throw new Error("CEO Error: BYTECODE is not configured in index.html!");
                }
                
                // The "Factory" that builds our contract
                const contractFactory = new ethers.ContractFactory(
                    STAKING_CONTRACT_ABI,
                    STAKING_CONTRACT_BYTECODE,
                    signer
                );
                
                // We deploy the factory, passing the memecoinAddress
                // to the "constructor" of our Solidity contract
                const contract = await contractFactory.deploy(memecoinAddress);
                
                // Wait for the contract to be officially published on the blockchain
                await contract.deployed();
                
                // 6. Success!
                showSuccess(`SUCCESS! Your new Staking Contract is live at: ${contract.address}`);

            } catch (error) {
                console.error(error);
                showError(error.message); // Show a friendly error
            }
            
            deployButton.disabled = false; // Re-enable the button
        });

        // Feedback functions for the user
        function showMessage(message) {
            resultsBox.style.display = "block";
            resultsBox.style.borderColor = "#888";
            resultsText.style.color = "#E0E0E0";
            resultsText.innerText = `Status: ${message}`;
        }

        function showSuccess(message) {
            resultsBox.style.display = "block";
            resultsBox.style.borderColor = "var(--color-primary)";
            resultsText.style.color = "var(--color-primary)";
            resultsText.innerText = message;
        }

        function showError(message) {
            resultsBox.style.display = "block";
            resultsBox.style.borderColor = "#FF4136"; // Red
            resultsText.style.color = "#FF4136";
            resultsText.innerText = `Error: ${message}`;
        }

    </script>
