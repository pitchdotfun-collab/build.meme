<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>build.meme - Build any dApp with AI</title>
    
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js" type="application/javascript"></script>
    
    <style>
        :root {
            --color-background: #111111;
            --color-text: #E0E0E0;
            --color-primary: #00FF00; /* four.meme green */
            --color-border: #333333;
            --font-mono: 'Courier New', Courier, monospace;
        }
        
        body {
            font-family: var(--font-mono);
            background-color: var(--color-background);
            color: var(--color-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            color: var(--color-primary);
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--color-primary);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 40px;
        }

        .input-box {
            background-color: #1A1A1A;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 20px;
        }
        
        /* The new Gemini-style prompt box */
        .prompt-area {
            width: 100%;
            height: 120px; /* Taller */
            background-color: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 15px;
            font-family: var(--font-mono);
            color: var(--color-text);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 20px;
            resize: none; /* No resize handle */
        }
        .prompt-area::placeholder { color: #555; }

        .btn-proceed {
            width: 100%; background-color: var(--color-primary); color: var(--color-background);
            border: none; padding: 15px; font-family: var(--font-mono); font-size: 1.2rem;
            font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-proceed:disabled { background-color: #555; cursor: not-allowed; }
        .btn-proceed:hover:not(:disabled) { background-color: #fff; color: #000; box-shadow: 0 0 15px var(--color-primary); }
        
        .footer-warning { margin-top: 40px; font-size: 0.9rem; color: #FFA500; border: 1px solid #FFA500; padding: 10px; border-radius: 4px; }
        .footer-warning a { color: var(--color-primary); text-decoration: underline; }
        
        .results { display: none; margin-top: 20px; padding: 15px; background-color: #1A1A1A; border: 1px solid var(--color-primary); border-radius: 8px; word-wrap: break-word; }
        .results p { margin: 0; }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="logo">build.meme</div>
        
        <h1>What do you want to build?</h1>
        <p class="subtitle">Describe your dApp, and our AI will build it. (Powered by Gemini)</p>

        <div class="input-box">
            <textarea id="prompt-input" class="prompt-area" placeholder="e.g., 'A staking pool for my token with a pirate theme'"></textarea>
            
            <button id="btn-proceed" class="btn-proceed">BUILD IT!</button>
        </div>

        <div id="results-box" class="results">
            <p id="results-text"></p>
        </div>

        </div>

        // --- ENGINE LOGIC (MY JOB, DEVELOPER) ---

        const deployButton = document.getElementById("btn-proceed");
        const promptInput = document.getElementById("prompt-input"); // The prompt box
        const resultsBox = document.getElementById("results-box");
        const resultsText = document.getElementById("results-text");

        let provider;
        let signer;

        deployButton.addEventListener("click", async () => {
            
            deployButton.disabled = true;
            
            try {
                // 1. Connect to Wallet
                if (typeof window.ethereum === "undefined") throw new Error("MetaMask is not installed.");
                
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                
                // 2. Check Network (Testnet)
                const { chainId } = await provider.getNetwork();
                if (chainId.toString(16) !== TESTNET_CHAIN_ID.substring(2)) {
                    throw new Error("Please switch your MetaMask to BNB Testnet (ChainID 97).");
                }

                // 3. Get the Creative Prompt (We don't use it yet, but we get it)
                const creativePrompt = promptInput.value;
                if (creativePrompt.length < 10) {
                    throw new Error("Please describe your dApp in more detail (min 10 chars).");
                }
                
                // 4. Charge the Platform Fee
                showMessage("Processing platform fee (0.05 Testnet BNB)...");
                
                if (FEE_WALLET.includes("...")) throw new Error("CEO Error: FEE_WALLET is not configured!");
                
                const feeTx = await signer.sendTransaction({ to: FEE_WALLET, value: FEE_AMOUNT_WEI });
                await feeTx.wait();
                
                // 5. Deploy the Staking Contract (v2)
                // MVP NOTE: We ignore the 'creativePrompt' and deploy our *only* mold.
                showMessage("Fee paid! Deploying your new Staking Contract (v2)...");
                
                if (STAKING_CONTRACT_BYTECODE_V2.includes("...")) throw new Error("CEO Error: BYTECODE is not configured!");
                
                const contractFactory = new ethers.ContractFactory(
                    STAKING_CONTRACT_ABI_V2,
                    STAKING_CONTRACT_BYTECODE_V2,
                    signer
                );
                
                // The V2 constructor is empty, so we pass NO arguments.
                const contract = await contractFactory.deploy();
                
                await contract.deployed();
                
                // 6. Success!
                showSuccess(`SUCCESS! Your new Staking Contract (v2) is live at: ${contract.address}`);

            } catch (error) {
                console.error(error);
                showError(error.message);
            }
            
            deployButton.disabled = false;
        });

        // Feedback functions (same as before)
        function showMessage(message) {
            resultsBox.style.display = "block"; resultsBox.style.borderColor = "#888";
            resultsText.style.color = "#E0E0E0"; resultsText.innerText = `Status: ${message}`;
        }
        function showSuccess(message) {
            resultsBox.style.display = "block"; resultsBox.style.borderColor = "var(--color-primary)";
            resultsText.style.color = "var(--color-primary)"; resultsText.innerText = message;
        }
        function showError(message) {
            resultsBox.style.display = "block"; resultsBox.style.borderColor = "#FF4136";
            resultsText.style.color = "#FF4136"; resultsText.innerText = `Error: ${message}`;
        }

    </script>
